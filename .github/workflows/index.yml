name: Index

on:
  pull_request:
    paths:
      - "evidence/**"
      - "adr/**"
      - "playbook/**"
      - "ledger/**"
      - "reviews/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "INDEX.md"
      - "GRAPH.md"
      - "AGENTS.md"
      - "CONVENTIONS.md"
      - "GUIDE.md"
      - "SETUP.md"
      - "README.md"
      - ".github/scripts/build-index.sh"
      - ".github/scripts/check-id-collisions.sh"
      - ".github/workflows/index.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    name: Check generated index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify INDEX.md is up to date
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/build-index.sh
          bash .github/scripts/build-index.sh --check

      # Collisions with the base branch fail (this branch must renumber); those
      # with other unmerged branches only warn (ADR-018).
      - name: Scan for id collisions
        shell: bash
        env:
          BASE_REF: refs/remotes/origin/${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          chmod +x .github/scripts/check-id-collisions.sh
          bash .github/scripts/check-id-collisions.sh | tee -a "$GITHUB_STEP_SUMMARY"
